services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jobtracker-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "JobTrackerSqlServer123!"
    ports:
      - "1434:1433"
    volumes:
      - jobtracker-sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    container_name: jobtracker-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SecretKey: "JobTracker-Development-Secret-Key-At-Least-32-Characters!"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=JobTrackerDb;User Id=sa;Password=JobTrackerSqlServer123!;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  jobtracker-sqlserver-data: